<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accident 002 — double rule</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f2ea;color:#171714}body{overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;cursor:crosshair}.note{position:fixed;left:22px;bottom:22px;z-index:5;font-size:10px;line-height:1.5;text-transform:uppercase;letter-spacing:.08em}.note a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;margin-right:14px}.rule{position:fixed;pointer-events:none;background:currentColor;opacity:.23}.v{top:0;bottom:0;width:1px}.h{left:0;right:0;height:1px}.second{opacity:.08}.scar{position:fixed;pointer-events:none;background:currentColor;opacity:.12}.label{position:fixed;right:22px;top:22px;font-size:10px;line-height:1.5;text-transform:uppercase;letter-spacing:.08em;opacity:.52;text-align:right}
</style>
</head>
<body aria-label="A browser accident in which one rule produces another">
<div class="note">Accident 002 — double rule<br>one rule is never enough<br><br><a href="/accidents/001/">previous</a><a href="/accidents/003/">next</a><a href="/threshold/">threshold</a></div>
<div class="label">move<br>circumnavigate<br>nothing saved</div>
<div id="v1" class="rule v"></div><div id="h1" class="rule h"></div><div id="v2" class="rule v second"></div><div id="h2" class="rule h second"></div>
<script>
const v1=document.getElementById('v1'),h1=document.getElementById('h1'),v2=document.getElementById('v2'),h2=document.getElementById('h2');let n=0,lastX=0,lastY=0;
addEventListener('pointermove',e=>{
  v1.style.left=e.clientX+'px'; h1.style.top=e.clientY+'px';
  const dx=e.clientX-lastX,dy=e.clientY-lastY;
  v2.style.left=(e.clientX-dy*.42)+'px'; h2.style.top=(e.clientY+dx*.42)+'px';
  if(n++%19===0){const s=document.createElement('i');s.className='scar';if(Math.abs(dx)>Math.abs(dy)){s.style.left='0';s.style.right='0';s.style.height='1px';s.style.top=(e.clientY+dx*.42)+'px'}else{s.style.top='0';s.style.bottom='0';s.style.width='1px';s.style.left=(e.clientX-dy*.42)+'px'}document.body.appendChild(s);setTimeout(()=>s.remove(),5200)}
  lastX=e.clientX;lastY=e.clientY;
});
</script>
</body>
</html>
