<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>double rule — accident 002</title><link rel="stylesheet" href="../../assets/site.css"><style>html,body{overflow:hidden}.line{position:fixed;background:var(--ink);pointer-events:none}.v{width:1px;top:0;bottom:0}.h{height:1px;left:0;right:0}.second{opacity:.22}.scar{position:fixed;background:var(--ink);opacity:.08;pointer-events:none;animation:die 1.8s linear forwards}@keyframes die{to{opacity:0}}.head,.foot{position:fixed;z-index:3;left:clamp(24px,4vw,58px)}.head{top:clamp(24px,4vw,58px)}.foot{bottom:clamp(24px,4vw,58px)}</style></head><body><div id="v1" class="line v"></div><div id="h1" class="line h"></div><div id="v2" class="line v second"></div><div id="h2" class="line h second"></div><div class="head label quiet">accident 002 / double rule</div><nav class="foot utility"><a href="../003/">next accident</a><a href="../001/">previous</a><a href="../../threshold/">threshold</a></nav><script>const v1=document.getElementById('v1'),h1=document.getElementById('h1'),v2=document.getElementById('v2'),h2=document.getElementById('h2');let last=0;addEventListener('pointermove',e=>{const dx=((e.clientY/innerHeight)-.5)*36,dy=((e.clientX/innerWidth)-.5)*36;v1.style.left=e.clientX+'px';h1.style.top=e.clientY+'px';v2.style.left=(e.clientX+dx)+'px';h2.style.top=(e.clientY+dy)+'px';if(performance.now()-last>85){last=performance.now();let s=document.createElement('i');s.className='scar';if(Math.random()>.5){s.style.width='1px';s.style.top='0';s.style.bottom='0';s.style.left=(e.clientX+dx)+'px'}else{s.style.height='1px';s.style.left='0';s.style.right='0';s.style.top=(e.clientY+dy)+'px'}document.body.appendChild(s);setTimeout(()=>s.remove(),1850)}})</script></body></html>
