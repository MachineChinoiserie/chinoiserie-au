<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accident 003 — pace</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f2ea;color:#171714}body{overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;cursor:crosshair}.note{position:fixed;left:22px;bottom:22px;z-index:5;font-size:10px;line-height:1.5;text-transform:uppercase;letter-spacing:.08em}.note a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;margin-right:14px}.label{position:fixed;right:22px;top:22px;font-size:10px;line-height:1.5;text-transform:uppercase;letter-spacing:.08em;opacity:.5;text-align:right}.seed{position:fixed;width:5px;height:5px;border:1px solid currentColor;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:.28}.grown{width:34px;height:34px;opacity:.75;transition:width 1.8s ease,height 1.8s ease,opacity 1.8s ease}.ring{position:fixed;width:8px;height:8px;border:1px solid currentColor;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:.18;animation:rest 3.8s ease forwards}@keyframes rest{to{width:110px;height:110px;opacity:0}}
</style>
</head>
<body aria-label="A browser accident that only develops when movement pauses">
<div class="note">Accident 003 — pace<br>move if you like<br>the page waits for you to stop<br><br><a href="/accidents/002/">previous</a><a href="/accidents/004/">next</a><a href="/threshold/">threshold</a></div>
<div class="label">nothing happens faster<br>because you hurry</div>
<script>
let timer,last=null,current=null;
addEventListener('pointermove',e=>{
  last={x:e.clientX,y:e.clientY};
  if(!current){current=document.createElement('i');current.className='seed';document.body.appendChild(current)}
  current.style.left=e.clientX+'px';current.style.top=e.clientY+'px';current.classList.remove('grown');
  clearTimeout(timer);
  timer=setTimeout(()=>{
    if(!last||!current)return;
    current.classList.add('grown');
    const r=document.createElement('b');r.className='ring';r.style.left=last.x+'px';r.style.top=last.y+'px';document.body.appendChild(r);setTimeout(()=>r.remove(),3900);
    setTimeout(()=>{if(current){current.remove();current=null}},2300);
  },900);
});
</script>
</body>
</html>
