<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>two left hands — accident 001</title><link rel="stylesheet" href="../../assets/site.css"><style>html,body{overflow:hidden}canvas{position:fixed;inset:0}.head,.foot{position:fixed;z-index:2;left:clamp(24px,4vw,58px)}.head{top:clamp(24px,4vw,58px)}.foot{bottom:clamp(24px,4vw,58px)}</style></head><body><canvas id="c"></canvas><div class="head label quiet">accident 001 / two left hands</div><nav class="foot utility"><a href="../002/">next accident</a><a href="../../threshold/">threshold</a></nav><script>const c=document.getElementById('c'),g=c.getContext('2d');let pts=[];function fit(){let d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;c.style.width=innerWidth+'px';c.style.height=innerHeight+'px';g.setTransform(d,0,0,d,0,0)}fit();addEventListener('resize',fit);addEventListener('pointermove',e=>pts.push({x:e.clientX,y:e.clientY,t:performance.now()}));function draw(t){g.clearRect(0,0,innerWidth,innerHeight);for(const p of pts){let a=1-(t-p.t)/900;if(a>0){g.fillStyle=`rgba(23,23,21,${a*.7})`;g.beginPath();g.arc(p.x,p.y,2,0,7);g.fill();g.fillStyle=`rgba(23,23,21,${a*.23})`;g.beginPath();g.arc(innerWidth-p.x,p.y,2,0,7);g.fill()}}pts=pts.filter(p=>t-p.t<900);requestAnimationFrame(draw)}requestAnimationFrame(draw)</script></body></html>
