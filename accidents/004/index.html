<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accident 004 — head typist</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#f4f2ea;color:#171714}body{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;overflow:hidden}.field{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:12vw}.line{display:flex;flex-wrap:wrap;justify-content:center;gap:.42em 1.05em;max-width:980px;font-size:clamp(1.35rem,3.2vw,3.6rem);line-height:1.18;text-align:center}.word{display:inline-block;transition:transform .7s cubic-bezier(.2,.8,.2,1),letter-spacing .7s ease,opacity .7s ease}.word.corrected{transform:translateY(var(--y)) rotate(var(--r));letter-spacing:var(--s);opacity:.58}.note{position:fixed;left:22px;bottom:22px;font-size:10px;line-height:1.5;text-transform:uppercase;letter-spacing:.08em}.note a{color:inherit;text-decoration:none;border-bottom:1px solid currentColor;margin-right:14px}.label{position:fixed;right:22px;top:22px;font-size:10px;line-height:1.5;text-transform:uppercase;letter-spacing:.08em;opacity:.5;text-align:right}
</style>
</head>
<body aria-label="A browser accident in which typing changes the posture of existing words rather than adding new ones">
<div class="field"><div class="line" id="line" aria-live="polite"><span class="word">THE</span><span class="word">LINE</span><span class="word">WAS</span><span class="word">FINE</span><span class="word">UNTIL</span><span class="word">SOMEONE</span><span class="word">DECIDED</span><span class="word">TO</span><span class="word">CORRECT</span><span class="word">IT</span></div></div>
<div class="note">Accident 004 — head typist<br>press any key<br>each keystroke corrects the wrong thing<br>no new words are required<br><br><a href="/accidents/003/">previous</a><a href="/threshold/">threshold</a></div>
<div class="label">nothing is stored<br>nothing is transmitted</div>
<script>
const words=[...document.querySelectorAll('.word')];
let i=0;
function correct(){
  const w=words[i%words.length]; i++;
  w.style.setProperty('--y',((Math.random()-.5)*34).toFixed(1)+'px');
  w.style.setProperty('--r',((Math.random()-.5)*7).toFixed(1)+'deg');
  w.style.setProperty('--s',(Math.random()*.32).toFixed(2)+'em');
  w.classList.add('corrected');
  setTimeout(()=>w.classList.remove('corrected'),1200);
}
addEventListener('keydown',e=>{if(!e.metaKey&&!e.ctrlKey&&!e.altKey)correct()});
addEventListener('pointerdown',correct);
</script>
</body>
</html>
