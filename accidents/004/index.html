<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>head typist — accident 004</title><link rel="stylesheet" href="../../assets/site.css"><style>.sentence{font-size:clamp(27px,5vw,70px);line-height:1.08;letter-spacing:-.025em;max-width:15ch}.sentence span{display:inline-block;transition:transform .12s,letter-spacing .12s;margin-right:.18em}.sentence span.wrong{transform:translate(var(--x),var(--y)) rotate(var(--r));letter-spacing:var(--s)}</style></head><body><main class="room no-select"><p class="label quiet">accident 004 / head typist</p><section class="room-center"><div id="s" class="sentence" aria-label="each keystroke corrects the wrong thing"></div><p class="mono quiet">each keystroke corrects the wrong thing</p></section><nav class="utility"><a href="../005/">next accident</a><a href="../003/">previous</a><a href="../../threshold/">threshold</a></nav></main><script>const words='The sentence was already complete before the typist arrived'.split(' '),s=document.getElementById('s');words.forEach(w=>{let e=document.createElement('span');e.textContent=w;s.appendChild(e)});function disturb(){let e=s.children[Math.floor(Math.random()*s.children.length)];e.style.setProperty('--x',((Math.random()-.5)*34)+'px');e.style.setProperty('--y',((Math.random()-.5)*18)+'px');e.style.setProperty('--r',((Math.random()-.5)*8)+'deg');e.style.setProperty('--s',(Math.random()*5)+'px');e.classList.add('wrong');setTimeout(()=>e.classList.remove('wrong'),480)}addEventListener('keydown',e=>{if(!e.metaKey&&!e.ctrlKey)disturb()});addEventListener('pointerdown',disturb)</script></body></html>
