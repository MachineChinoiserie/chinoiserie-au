<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>signal — accident 005</title><link rel="stylesheet" href="../../assets/site.css"><style>.signal{font:clamp(22px,5vw,66px)/1.4 var(--mono);letter-spacing:.2em;min-height:5rem;max-width:15ch;overflow-wrap:anywhere}.keys{display:flex;gap:1.6rem;margin-top:3rem}.keys button{font:12px/1 var(--mono);text-transform:uppercase;border-bottom:1px solid var(--faint);padding-bottom:4px}.status{margin-top:2rem}</style></head><body><main class="room"><p class="label quiet">accident 005 / signal</p><section class="room-center"><div id="signal" class="signal" aria-live="polite"></div><div class="keys"><button data-k="•">dot</button><button data-k="—">dash</button><button data-k=" ">space</button><button id="send">send</button></div><p id="status" class="mono quiet status">prototype receiver / nothing is stored / nothing is transmitted</p></section><nav class="utility"><a href="../004/">previous</a><a href="../../threshold/">threshold</a></nav></main><script>let msg='';const out=document.getElementById('signal'),st=document.getElementById('status');document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(msg.length<64){msg+=b.dataset.k;out.textContent=msg}});document.getElementById('send').onclick=()=>{if(!msg.trim())return;st.textContent='signal received locally';msg='';out.textContent='';setTimeout(()=>st.textContent='prototype receiver / nothing is stored / nothing is transmitted',1800)}</script></body></html>
