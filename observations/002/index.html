<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>borrowed minute — observation 002</title><link rel="stylesheet" href="../../assets/site.css"><style>.minute{display:flex;align-items:flex-end;gap:clamp(2px,.45vw,7px);height:180px;width:min(92vw,780px)}.tick{width:1px;height:62px;background:var(--ink);opacity:.24;transition:transform .35s,opacity .35s,height .35s}.tick.used{transform:translateY(22px);opacity:.08}.tick.now{height:118px;opacity:.9;transform:translateY(-8px)}</style></head><body><main class="room"><p class="label quiet">observation 002 / borrowed minute</p><section class="room-center"><div id="minute" class="minute" aria-label="sixty marks forming one repeatedly available minute"></div><p class="mono quiet" style="margin-top:2rem">this minute becomes available again</p></section><nav class="utility"><a href="../001/">previous observation</a><a href="../../threshold/">threshold</a></nav></main><script>const box=document.getElementById('minute');for(let i=0;i<60;i++){const s=document.createElement('span');s.className='tick';box.appendChild(s)}const ticks=[...box.children];let origin=Date.now();function go(){const sec=Math.floor((Date.now()-origin)/1000)%60;ticks.forEach((t,i)=>t.className='tick'+(i<sec?' used':i===sec?' now':''));requestAnimationFrame(go)}go()</script></body></html>
