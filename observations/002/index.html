<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Observation 002 — chinoiserie.au</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f2ea;
      color: #171714;
      font-family: Georgia, "Times New Roman", serif;
    }
    main {
      min-height: 100vh;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 3rem;
      padding: clamp(28px, 5vw, 72px);
    }
    .field {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .minute {
      width: min(82vw, 920px);
      display: grid;
      grid-template-columns: repeat(60, 1fr);
      gap: clamp(2px, .35vw, 6px);
      align-items: center;
    }
    .second {
      height: clamp(58px, 10vw, 130px);
      border-left: 1px solid rgba(23, 23, 20, .23);
      transition: opacity .35s ease, transform .35s ease, border-color .35s ease;
    }
    .second.spent {
      opacity: .16;
      transform: translateY(8px);
    }
    .second.now {
      border-left-width: 2px;
      border-left-color: #171714;
      transform: translateY(-4px);
    }
    .note {
      font: 10px/1.6 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      text-transform: uppercase;
      letter-spacing: .09em;
      max-width: 620px;
    }
    .note p { margin: 0 0 .35rem; }
    .note a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }
    .note a:hover,
    .note a:focus-visible {
      border-bottom-color: currentColor;
      outline: none;
    }
    @media (max-width: 680px) {
      .minute { width: 92vw; gap: 1px; }
      .second { height: 70px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="field" aria-hidden="true">
      <div class="minute" id="minute"></div>
    </div>
    <div class="note">
      <p>Observation 002 — borrowed minute.</p>
      <p>60 seconds / repeatedly available</p>
      <p>nothing is stored or recovered</p>
      <p><a href="/threshold/">return to threshold</a></p>
    </div>
  </main>

  <script>
    const field = document.getElementById('minute');
    const marks = Array.from({ length: 60 }, (_, index) => {
      const mark = document.createElement('span');
      mark.className = 'second';
      mark.dataset.second = index;
      field.appendChild(mark);
      return mark;
    });

    const started = performance.now();

    function draw(now) {
      const elapsed = Math.floor((now - started) / 1000);
      const current = elapsed % 60;

      marks.forEach((mark, index) => {
        mark.classList.toggle('spent', index < current);
        mark.classList.toggle('now', index === current);
      });

      requestAnimationFrame(draw);
    }

    requestAnimationFrame(draw);
  </script>
</body>
</html>
