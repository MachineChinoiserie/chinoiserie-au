<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>wrong differences — chinoiserie.au</title><link rel="stylesheet" href="../../assets/site.css"><style>.edition{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(7px,1.2vw,18px);width:min(92vw,720px);height:210px;align-items:end}.copy{height:150px;border-left:1px solid var(--ink);opacity:.55;cursor:pointer;position:relative}.copy.wrong{height:174px;transform:translateX(4px);opacity:1}.copy:after{content:attr(data-n);position:absolute;bottom:-28px;left:-4px;font:9px/1 var(--mono);color:var(--quiet)}</style></head><body><main class="room"><p class="label quiet">fragment / wrong differences</p><section class="room-center"><div id="e" class="edition" aria-label="twelve copies, one discrepancy"></div><p class="mono quiet" style="margin-top:4rem">differences are allowed until they become the wrong differences</p></section><nav class="utility"><a href="../under-artificial-light/">under artificial light</a><a href="../../threshold/">threshold</a></nav></main><script>const e=document.getElementById('e');let wrong=6;for(let i=1;i<=12;i++){let b=document.createElement('button');b.className='copy';b.dataset.n=String(i).padStart(2,'0');b.onclick=()=>{wrong=(wrong+1+Math.floor(Math.random()*10))%12;paint()};e.appendChild(b)}function paint(){[...e.children].forEach((x,i)=>x.classList.toggle('wrong',i===wrong))}paint()</script></body></html>
