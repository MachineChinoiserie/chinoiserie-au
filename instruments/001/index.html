<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>temporary marks — instrument 001</title><link rel="stylesheet" href="../../assets/site.css"><style>html,body{overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.head,.foot{position:fixed;left:clamp(24px,4vw,58px);z-index:2}.head{top:clamp(24px,4vw,58px)}.foot{bottom:clamp(24px,4vw,58px)}</style></head><body><canvas id="field" aria-label="blank field for temporary marks"></canvas><div class="head label quiet">instrument 001 / temporary marks</div><nav class="foot utility"><a href="../002/">small weather</a><a href="../../threshold/">threshold</a></nav><script>const c=document.getElementById('field'),x=c.getContext('2d');let marks=[];function fit(){const d=devicePixelRatio||1;c.width=innerWidth*d;c.height=innerHeight*d;x.setTransform(d,0,0,d,0,0)}addEventListener('resize',fit);fit();function add(e){const r=c.getBoundingClientRect(),p=e.pressure&&e.pressure>0?e.pressure:.32;marks.push({x:e.clientX-r.left,y:e.clientY-r.top,r:2+p*8,a:1,t:performance.now()})}c.addEventListener('pointerdown',add);c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')add(e)});function draw(t){x.clearRect(0,0,innerWidth,innerHeight);for(const m of marks){m.a=1-(t-m.t)/3200;if(m.a>0){x.globalAlpha=m.a;x.lineWidth=.6+(.8*m.a);x.strokeStyle='#171715';x.beginPath();x.arc(m.x,m.y,m.r,0,Math.PI*2);x.stroke()}}x.globalAlpha=1;marks=marks.filter(m=>m.a>0);requestAnimationFrame(draw)}requestAnimationFrame(draw)</script></body></html>
