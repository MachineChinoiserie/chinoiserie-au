<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instrument 001 — chinoiserie.au</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: #030305;
      color: #cfff00;
      cursor: crosshair;
      font-family: "Courier New", ui-monospace, monospace;
      background-image: radial-gradient(circle at 25% 25%, rgba(255,0,200,.08) 0 1px, transparent 1px), radial-gradient(circle at 75% 60%, rgba(0,255,255,.07) 0 1px, transparent 1px);
      background-size: 23px 23px, 31px 31px;
    }
    .note {
      position: fixed;
      left: 14px;
      top: 14px;
      z-index: 3;
      max-width: 28rem;
      padding: 8px 10px;
      border: 1px solid #ff44cc;
      background: rgba(0,0,0,.82);
      box-shadow: 4px 4px 0 #27102c;
      font-size: 10px;
      line-height: 1.45;
      text-transform: uppercase;
      letter-spacing: .03em;
      user-select: none;
      pointer-events: none;
    }
    .note p { margin: 0 0 .5rem; }
    .note a {
      color: #00ffff;
      text-decoration: none;
      pointer-events: auto;
      margin-right: 1rem;
    }
    .note a:hover { background:#00ffff; color:#000; }
    .mark {
      position: fixed;
      border: 1px solid currentColor;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      box-shadow: 0 0 5px currentColor;
    }
  </style>
</head>
<body aria-label="A blank field for temporary marks">
  <div class="note">
    <p>INSTRUMENT_001 // TEMPORARY MARKS</p>
    <p>click field / nothing is saved</p>
    <a href="/">profile</a><a href="/instruments/002/">next.exe</a>
  </div>

  <script>
    const field = document.body;
    let count = 0;

    field.addEventListener('pointerdown', (event) => {
      if (event.target.closest('a')) return;

      const mark = document.createElement('span');
      mark.className = 'mark';

      const pressure = event.pressure > 0 ? event.pressure : 0.35;
      const diameter = 5 + (pressure * 18) + ((count % 7) * 0.7);

      mark.style.left = `${event.clientX}px`;
      mark.style.top = `${event.clientY}px`;
      mark.style.width = `${diameter}px`;
      mark.style.height = `${diameter}px`;
      mark.style.opacity = `${0.45 + Math.min(pressure, 1) * 0.5}`;
      mark.style.color = count % 3 === 0 ? '#ff44cc' : (count % 3 === 1 ? '#00ffff' : '#cfff00');

      field.appendChild(mark);
      count += 1;

      if (count > 72) {
        const first = field.querySelector('.mark');
        if (first) first.remove();
        count -= 1;
      }
    });
  </script>
</body>
</html>
