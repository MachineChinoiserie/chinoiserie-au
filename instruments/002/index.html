<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>small weather — instrument 002</title><link rel="stylesheet" href="../../assets/site.css"><style>html,body{overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}.head,.foot{position:fixed;left:clamp(24px,4vw,58px);z-index:2}.head{top:clamp(24px,4vw,58px)}.foot{bottom:clamp(24px,4vw,58px)}</style></head><body><canvas id="sky"></canvas><div class="head label quiet">instrument 002 / small weather</div><nav class="foot utility"><a href="../001/">temporary marks</a><a href="../../threshold/">threshold</a></nav><script>const c=document.getElementById('sky'),g=c.getContext('2d');let w,h,px=-999,py=-999,pts=[];function fit(){const d=devicePixelRatio||1,w0=innerWidth,h0=innerHeight;c.width=w0*d;c.height=h0*d;c.style.width=w0+'px';c.style.height=h0+'px';g.setTransform(d,0,0,d,0,0);w=w0;h=h0;if(!pts.length)for(let i=0;i<46;i++)pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.16,vy:(Math.random()-.5)*.1,r:1.5+Math.random()*3})}addEventListener('resize',fit);fit();addEventListener('pointermove',e=>{px=e.clientX;py=e.clientY});addEventListener('pointerleave',()=>px=py=-999);function tick(){g.clearRect(0,0,w,h);for(const p of pts){let dx=p.x-px,dy=p.y-py,d=Math.hypot(dx,dy);if(d<110){let f=(110-d)/110*.16;p.vx+=dx/(d||1)*f;p.vy+=dy/(d||1)*f}p.vx*=.992;p.vy*=.992;p.x+=p.vx+.025;p.y+=p.vy;if(p.x>w+10)p.x=-10;if(p.x<-10)p.x=w+10;if(p.y>h+10)p.y=-10;if(p.y<-10)p.y=h+10;g.strokeStyle='rgba(23,23,21,.55)';g.lineWidth=.7;g.beginPath();g.arc(p.x,p.y,p.r,0,Math.PI*2);g.stroke()}requestAnimationFrame(tick)}tick()</script></body></html>
