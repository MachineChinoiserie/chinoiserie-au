<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Instrument 002 — Small Weather — chinoiserie.au</title>
  <meta name="description" content="Instrument 002 at chinoiserie.au: small weather, a field of drifting particles affected by nearby movement. The field remembers nothing.">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://chinoiserie.au/instruments/002/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Instrument 002 — Small Weather">
  <meta property="og:description" content="Move through the field. The field remembers nothing.">
  <meta property="og:url" content="https://chinoiserie.au/instruments/002/">
  <meta name="twitter:card" content="summary">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: #f4f2ea;
      color: #171714;
      cursor: crosshair;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    .note {
      position: fixed;
      left: clamp(24px, 4vw, 56px);
      bottom: clamp(24px, 4vw, 56px);
      z-index: 2;
      font-size: 11px;
      line-height: 1.55;
      text-transform: uppercase;
      letter-spacing: .08em;
      user-select: none;
    }
    .note p { margin: 0 0 .75rem; }
    .note a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid currentColor;
      margin-right: 1rem;
    }
  </style>
</head>
<body aria-label="A field of drifting particles affected by nearby movement">
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="note">
    <p>Instrument 002 — small weather</p>
    <p>Move through the field.<br>The field remembers nothing.</p>
    <a href="/instruments/001/">previous</a><a href="/">surface</a>
  </div>

  <script>
    const canvas = document.getElementById('field');
    const ctx = canvas.getContext('2d');
    const pointer = { x: -9999, y: -9999, active: false };
    let dots = [];
    let w = 0, h = 0, dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!dots.length) seed();
    }

    function seed() {
      const count = Math.max(42, Math.min(84, Math.floor((w * h) / 15000)));
      dots = Array.from({ length: count }, (_, i) => ({
        x: Math.random() * w,
        y: Math.random() * h,
        vx: (Math.random() - .5) * .14,
        vy: (Math.random() - .5) * .10,
        r: 1.2 + (i % 5) * .35,
        phase: Math.random() * Math.PI * 2
      }));
    }

    function movePointer(e) {
      pointer.x = e.clientX;
      pointer.y = e.clientY;
      pointer.active = true;
    }

    window.addEventListener('pointermove', movePointer, { passive: true });
    window.addEventListener('pointerdown', movePointer, { passive: true });
    window.addEventListener('pointerleave', () => pointer.active = false);
    window.addEventListener('resize', resize);

    function frame(t) {
      ctx.clearRect(0, 0, w, h);
      ctx.strokeStyle = '#171714';

      for (const dot of dots) {
        dot.phase += .0025;
        dot.vx += Math.cos(dot.phase) * .0008;
        dot.vy += Math.sin(dot.phase * .9) * .0006;

        if (pointer.active) {
          const dx = dot.x - pointer.x;
          const dy = dot.y - pointer.y;
          const dist2 = dx * dx + dy * dy;
          if (dist2 < 22000 && dist2 > 1) {
            const force = (1 - dist2 / 22000) * .055;
            const dist = Math.sqrt(dist2);
            dot.vx += (dx / dist) * force;
            dot.vy += (dy / dist) * force;
          }
        }

        dot.vx *= .992;
        dot.vy *= .992;
        dot.x += dot.vx;
        dot.y += dot.vy;

        if (dot.x < -12) dot.x = w + 12;
        if (dot.x > w + 12) dot.x = -12;
        if (dot.y < -12) dot.y = h + 12;
        if (dot.y > h + 12) dot.y = -12;

        ctx.globalAlpha = .28 + (dot.r / 4) * .28;
        ctx.beginPath();
        ctx.arc(dot.x, dot.y, dot.r, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.globalAlpha = 1;
      requestAnimationFrame(frame);
    }

    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
