<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>threshold — chinoiserie.au</title>
  <style>
    :root { --paper:#f4f2ea; --ink:#171715; --quiet:#77736a; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:var(--paper); color:var(--ink); }
    body { min-height:100vh; padding:clamp(24px,4vw,58px); font-family:Georgia,'Times New Roman',serif; }
    main { min-height:80vh; display:grid; grid-template-rows:auto 1fr auto; }
    .label, a { font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; letter-spacing:.06em; text-transform:uppercase; color:var(--quiet); }
    .label { margin:0; }
    .field { align-self:center; max-width:31rem; }
    .field p { margin:0; font-size:clamp(22px,3vw,38px); line-height:1.15; }
    nav { display:flex; gap:18px; flex-wrap:wrap; }
    a { text-decoration:none; border-bottom:1px solid transparent; }
    a:hover,a:focus-visible { color:var(--ink); border-color:var(--ink); }
  </style>
</head>
<body>
  <main>
    <p class="label">threshold</p>
    <div class="field"><p>A place for things that do not yet require a purpose.</p></div>
    <nav aria-label="threshold exits"><a href="../">surface</a></nav>
  </main>
</body>
</html>
