<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>maintenance interval — Water Diary 002</title><link rel="stylesheet" href="../../assets/site.css"><style>.vessel{width:min(55vw,260px);height:340px;border:1px solid var(--ink);border-top:0;position:relative;overflow:hidden;cursor:ns-resize;touch-action:none}.waterfill{position:absolute;left:0;right:0;bottom:0;height:3%;background:rgba(23,23,21,.12);transition:height .08s linear}.status{margin-top:1.8rem}</style></head><body><main class="room"><p class="label quiet">water diary 002 / maintenance interval</p><section class="room-center"><div id="v" class="vessel no-select" aria-label="hold to fill"><div id="f" class="waterfill"></div></div><p id="s" class="mono quiet status">water: insufficiently persuasive</p></section><nav class="utility"><a href="../2026-08-10/">water diary 001</a><a href="../../">surface</a></nav></main><script>const v=document.getElementById('v'),f=document.getElementById('f'),s=document.getElementById('s');let level=.03,hold=false,last=performance.now();function label(){s.textContent=level<.27?'water: insufficiently persuasive':level<.55?'water: entering circulation':level<.88?'water: nearly administrative':'water: yes'}v.onpointerdown=e=>{hold=true;v.setPointerCapture(e.pointerId)};v.onpointerup=v.onpointercancel=()=>hold=false;function tick(t){if(hold)level=Math.min(1,level+(t-last)/5400);last=t;f.style.height=(level*100)+'%';label();requestAnimationFrame(tick)}requestAnimationFrame(tick)</script></body></html>
